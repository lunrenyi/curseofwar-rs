name: release

# Build release binaries for every published GitHub release and attach
# them as `curseofwar-<version>-<target>.tar.gz` assets.
#
# Targets:
# - x86_64 Linux: native build on ubuntu-latest.
# - aarch64 Linux: cross-compiled via the cross-rs/cross Docker image,
#   invoked with docker + QEMU. The cross-rs/cross GitHub Action is
#   unusable here because the repo ships no `action.yml` at any tagged
#   release — we therefore call the image directly.
# - aarch64 Apple Silicon: native build on macos-latest.
#
# macOS x86_64 (macos-13) is intentionally excluded: the Intel runner
# pool has multi-hour queue waits. Users on Intel Macs can build from
# source with `cargo build --release`.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            artifact: curseofwar-linux-x86_64
          - name: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
            artifact: curseofwar-linux-aarch64
          - name: aarch64-apple-darwin
            os: macos-latest
            cross: false
            artifact: curseofwar-macos-aarch64

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install Rust toolchain (host)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.name }}

      - name: cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target.name }}-
            ${{ runner.os }}-cargo-

      # ---- Cross-compilation path: ubuntu runner is x86_64, so we spin
      # up the cross-rs/cross image with QEMU user-mode emulation. The
      # image's /usr/local/cargo is mounted to ~/.cargo on the host so
      # the cache step above actually hits. The workspace is mounted to
      # /project so build artifacts land in the host's target/ directory.
      - name: set up QEMU
        if: matrix.target.cross == true
        uses: docker/setup-qemu-action@v3

      - name: set up Docker Buildx
        if: matrix.target.cross == true
        uses: docker/setup-buildx-action@v3

      - name: build (cross via Docker)
        if: matrix.target.cross == true
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/project" \
            -v "${HOME}/.cargo/registry:/usr/local/cargo/registry" \
            -v "${HOME}/.cargo/git:/usr/local/cargo/git" \
            -w /project \
            ghcr.io/cross-rs/cross:${{ matrix.target.name }} \
            build --release --bin curseofwar --target ${{ matrix.target.name }}

      - name: build (native cargo)
        if: matrix.target.cross == false
        run: cargo build --release --bin curseofwar --target ${{ matrix.target.name }}

      - name: strip binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target.name }}/release/curseofwar"
          # GNU strip on Linux/macOS is multi-arch — it reads the ELF/Mach-O
          # header and dispatches to the right back-end, so this works for
          # cross-built aarch64 binaries on an x86_64 host.
          strip "$BIN"

      - name: package tarball
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target.name }}/release/curseofwar"
          DIR="${{ matrix.target.artifact }}"
          mkdir -p "$DIR"
          cp "$BIN" "$DIR/curseofwar"
          cp README.md "$DIR/README.md"
          cp README.en.md "$DIR/README.en.md"
          cp README.cn.md "$DIR/README.cn.md"
          cp LICENSE "$DIR/LICENSE"
          # Add a small README so the archive contents are self-explanatory.
          cat > "$DIR/INSTALL.txt" <<'EOF'
          Curse of War (Rust port)
          ========================

          Run the binary directly from this directory:

              ./curseofwar

          Optional flags: ./curseofwar --help

          See README.md for full gameplay / key-binding documentation,
          or press `?` in-game for the in-app help overlay.
          EOF
          tar -czf "${{ matrix.target.artifact }}.tar.gz" "$DIR"

      - name: upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.target.artifact }}.tar.gz
          fail_on_unmatched_files: true
