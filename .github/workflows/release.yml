# 推送 v*.*.* 标签时,矩阵构建多平台二进制并发布到 GitHub Release。
#
# 用法:
#   git tag v0.1.2
#   git push origin v0.1.2
#
# 流程:create-release 先建 Release,upload-binaries 再矩阵构建上传。
# Linux ARM64 用 aarch64-unknown-linux-musl (静态二进制,无需 glibc 交叉工具链)。
# macOS 仅出 Apple Silicon — Intel runner 排队太长,Intel Mac 用户请源码构建。

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-binaries:
    needs: create-release
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build and upload binaries
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: curseofwar
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          tar: unix
          zip: windows
          include: README.md,README.en.md,README.cn.md,LICENSE
          token: ${{ secrets.GITHUB_TOKEN }}
